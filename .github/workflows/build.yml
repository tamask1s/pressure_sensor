name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      soak:
        description: Run the 576000-sample storage test
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Service dependencies in an isolated environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libargon2-1
          python3 -m venv /tmp/pressure-ci
          /tmp/pressure-ci/bin/pip install -r service/requirements.txt httpx==0.28.1 pytest==9.1.1
      - name: Auth, atomic import, replay, redaction and claim-to-measurement tests
        run: PYTHONPATH=service /tmp/pressure-ci/bin/python -m pytest service/tests -q -o faulthandler_timeout=30

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib bin test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub test/admin_test.dart
      - run: flutter build web --release --no-pub --no-web-resources-cdn --pwa-strategy=none --base-href=/pressure_sensor/ --dart-define=API_URL=/pressure_sensor/api/v1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: web
          path: app/build/web/
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib bin test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter test --no-pub --dart-define=HAS_GPS=false
      - name: Storage endurance test
        if: github.event_name == 'workflow_dispatch' && inputs.soak
        run: flutter test --no-pub --dart-define=RUN_SOAK=true test/soak_test.dart
      - run: flutter build windows --release --no-pub
      - name: Build device simulator
        run: dart compile exe bin/simulator.dart -o build/windows/x64/runner/Release/pressure_simulator.exe
      - name: Include simulator instructions
        run: Copy-Item SIMULATOR.md build/windows/x64/runner/Release/SIMULATOR.md
      - name: Include Visual C++ runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC143.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          if (!$crt) { throw 'Visual C++ runtime not found' }
          Copy-Item "$($crt.FullName)/*.dll" 'build/windows/x64/runner/Release/'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 7

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release --no-pub
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-test-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Native C++ tests
        run: |
          cmake -S fw/test -B fw/build-native -DCMAKE_BUILD_TYPE=Release
          cmake --build fw/build-native
          ./fw/build-native/core_test
      - name: ESP32 firmware
        run: docker run --rm -v "$GITHUB_WORKSPACE:/project" -w /project/fw -e IDF_TARGET=esp32 espressif/idf:v6.0.2 idf.py build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: esp32-firmware
          path: |
            fw/build/pressure_sensor_v2.bin
            fw/build/bootloader/bootloader.bin
            fw/build/partition_table/partition-table.bin
            fw/build/flash_args
          if-no-files-found: error
          retention-days: 7
