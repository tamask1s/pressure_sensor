# pressure_sensor only; include in both existing HTTPS server blocks.
location = /pressure_sensor {
    access_log off;
    return 308 https://timeonion.com/pressure_sensor/;
}
location ^~ /pressure_sensor/ {
    if ($host = www.timeonion.com) { return 308 https://timeonion.com$request_uri; }
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 512k;
    client_body_timeout 15s;
    limit_req zone=timeonion_per_ip burst=40 nodelay;
    limit_req_status 429;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_redirect off;
    proxy_next_upstream off;
    proxy_pass http://127.0.0.1:8093/;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' blob: https://tile.openstreetmap.org https://fonts.gstatic.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
